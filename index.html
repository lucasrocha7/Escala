<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5f">
<meta name="description" content="Escala de auxiliares - Parque Orlanda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escala">
<script src="config.js"></script>
<script src="versao.js"></script>
<title>Escala de Auxiliares</title>
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1c2927; --mute:#667370; --line:#e3dfd4;
  --accent:#0f6b5f; --accent-ink:#fff; --soft:#e2f0ed; --me:#fff2c9; --me-ink:#6b4e00;
  --danger:#b3261e; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101819; --card:#182324; --ink:#e7eeed; --mute:#93a3a0; --line:#27363a;
  --accent:#3bb5a2; --accent-ink:#06201c; --soft:#16302d; --me:#4a3d12; --me-ink:#ffe08a;
  --danger:#ff8a80; --shadow:none;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);
  font-weight:600;cursor:pointer;min-height:44px}
.btn.sec{background:var(--soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
.field input,.field select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);min-height:44px}
.erro{color:var(--danger);font-size:14px;min-height:20px;margin:0 0 8px}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow)}
.login h1{font-size:24px;letter-spacing:-.02em}
.login .sub{margin:4px 0 22px;color:var(--mute)}
.login .btn{width:100%}

/* app */
.topwrap{position:sticky;top:0;z-index:5}
.top{background:var(--accent);color:var(--accent-ink);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .tit{flex:1;min-width:0}
.top b{display:block;font-size:17px;letter-spacing:-.01em}
.top small{opacity:.85;font-size:13px}
.top button{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:10px;width:40px;height:40px;font-size:18px}
main{padding:14px 14px calc(88px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:12px;color:var(--mute);
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
nav button i{font-style:normal;font-size:19px;line-height:1}
nav button.on{color:var(--accent);background:var(--soft);font-weight:600}

.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar select{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);min-height:44px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;color:var(--mute)}
.toggle input{width:20px;height:20px}

.dia{background:var(--card);border-radius:16px;padding:14px;margin:0 0 10px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:64px 1fr;gap:6px 14px;border:2px solid transparent}
.dia.prox{border-color:var(--accent)}
.data{grid-row:span 2;text-align:center;align-self:start}
.data b{display:block;font-size:30px;line-height:1;letter-spacing:-.03em}
.data span{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;margin-top:4px}
.data em{display:inline-block;margin-top:6px;font-style:normal;font-size:11px;font-weight:700;
  background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 6px}
.turmas{display:grid;gap:4px}
.t,.o{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.t label,.o label{font-size:13px;color:var(--mute);flex:none;width:78px}
.t .v,.o .v{flex:1;text-align:right;font-weight:600}
.v.eu{background:var(--me);color:var(--me-ink);border-radius:8px;padding:4px 10px;display:inline-block;flex:none}
.t select,.o select{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-height:40px;font-weight:600}
.o{border-top:1px dashed var(--line);padding-top:6px}
.o .v{font-weight:500;color:var(--accent)}
.vazio{text-align:center;color:var(--mute);padding:40px 10px}
.mes-tit{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 2px 8px}

.painel{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin:0 0 12px}
.painel h2{font-size:18px;margin-bottom:6px}
.painel p{margin:0 0 12px;color:var(--mute);font-size:14px}
.lista{list-style:none;margin:0 0 12px;padding:0}
.lista li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lista li:last-child{border:0}
.lista input[type=text]{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-height:44px}
.lista .ic{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:44px}
.lista li.off input[type=text]{opacity:.5;text-decoration:line-through}
.novo{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);min-height:44px;width:100%}
.lista .sw{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.lista .sw input{width:22px;height:22px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.usr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.usr:last-child{border-bottom:0}
.usr .n{flex:1;min-width:0}.usr .n b{display:block}.usr .n small{color:var(--mute)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--accent)}
.tag.off{background:var(--line);color:var(--mute)}
dialog{border:0;border-radius:20px;padding:20px;width:min(440px,calc(100vw - 24px));background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin-bottom:14px;font-size:19px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:#1c2927;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw;text-align:center;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--danger);color:#fff}
.load{opacity:.55;pointer-events:none}
#off{background:#8a5a00;color:#fff;font-size:13px;padding:8px 16px;line-height:1.35}
.dica{font-size:14px;color:var(--mute);margin:0 0 12px}
.ok{color:var(--accent);font-size:14px;margin:0 0 8px}.ok:empty{display:none}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:10px;font-size:14px;width:100%;cursor:pointer}
.aviso{background:var(--me);color:var(--me-ink);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.btn.peq{padding:8px 12px;min-height:40px;font-size:14px}
.mes-linha{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 8px}
.mes-linha .mes-tit{margin:0}
.obs{display:inline-block;font-style:normal;font-size:11px;font-weight:700;background:var(--me);color:var(--me-ink);border-radius:6px;padding:2px 6px}
.data .obs{margin-top:6px}
.mais{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:18px;line-height:1}
nav button{position:relative}
.bolha{position:absolute;top:2px;right:calc(50% - 26px);background:var(--danger);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;font-style:normal;font-weight:700;padding:0 4px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#upd span{flex:1}
.prev-linha{display:grid;grid-template-columns:28px 52px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.prev-linha.off{opacity:.45}.prev-linha input{width:22px;height:22px}
.prev-linha small{color:var(--accent);font-weight:600}
.cont{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.cont span{background:var(--soft);color:var(--accent);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li>div{flex:1;min-width:0}.hist small{display:block;color:var(--mute)}
.hist li.desfeito{opacity:.5}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <form id="f-login" autocomplete="on">
    <h1>Escala de Auxiliares</h1>
    <p class="sub">Jovens e menores · Parque Orlanda</p>
    <label class="field"><span>Usuário</span><input id="l-user" autocomplete="username" autocapitalize="none" autocorrect="off" required></label>
    <label class="field"><span>Senha</span><input id="l-pass" type="password" autocomplete="current-password" required></label>
    <p class="erro" id="l-erro"></p>
    <p class="ok" id="l-info"></p>
    <button class="btn" id="l-btn">Entrar</button>
    <button type="button" class="link" id="l-esqueci">Esqueci minha senha</button>
  </form>
</div>

<div id="app" hidden>
  <div class="topwrap">
  <header class="top">
    <div class="tit"><b>Escala de Auxiliares</b><small id="who"></small></div>
    <button id="refresh" title="Atualizar" aria-label="Atualizar">↻</button>
  </header>
  <div id="off" hidden></div>
  </div>
  <main>
    <section id="v-escala"></section>
    <section id="v-aux" hidden></section>
    <section id="v-users" hidden></section>
    <section id="v-gerar" hidden></section>
    <section id="v-sistema" hidden></section>
    <section id="v-conta" hidden></section>
  </main>
  <nav id="nav"></nav>
</div>

<dialog id="dlg">
  <form method="dialog" id="f-user">
    <h2 id="dlg-t">Usuário</h2>
    <label class="field"><span>Usuário (login)</span><input id="u-user" autocapitalize="none" autocorrect="off"></label>
    <label class="field"><span>Nome</span><input id="u-nome"></label>
    <label class="field"><span>Nível</span>
      <select id="u-nivel"><option value="usuario">Usuário (só consulta)</option><option value="admin">Administrador (edita tudo)</option></select></label>
    <label class="field"><span>Auxiliar vinculado (destaca "minha escala")</span><select id="u-aux"></select></label>
    <label class="field"><span id="u-senha-l">Senha</span><input id="u-senha" type="text" autocomplete="off" autocapitalize="none"></label>
    <label class="toggle"><input type="checkbox" id="u-ativo"> Usuário ativo</label>
    <p class="aviso" id="u-aviso" hidden>Este usuário pediu uma nova senha. Defina uma senha acima e combine com ele.</p>
    <p class="erro" id="u-erro"></p>
    <div class="row"><button type="button" class="btn sec" id="u-cancel">Cancelar</button><button type="button" class="btn" id="u-save">Salvar</button></div>
  </form>
</dialog>
<dialog id="dlg-data">
  <form method="dialog">
    <h2 id="d-t">Data</h2>
    <label class="field"><span>Data</span><input id="d-data" type="date"></label>
    <label class="field"><span>Observação (ex.: Assembleia, Visita)</span><input id="d-obs" maxlength="60"></label>
    <label class="toggle" id="d-prep-l"><input type="checkbox" id="d-prep"> Preencher com os próximos da fila</label>
    <p class="erro" id="d-erro"></p>
    <div class="row"><button type="button" class="btn sec" id="d-cancel">Cancelar</button><button type="button" class="btn" id="d-save">Salvar</button></div>
    <button type="button" class="btn danger" id="d-rem" style="width:100%;margin-top:10px">Remover esta data</button>
  </form>
</dialog>
<div id="upd" hidden><span>Nova versão disponível.</span><button class="btn peq" id="upd-btn">Atualizar</button></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataBR = iso => iso.split('-').reverse().join('/');
const fmtQuando = q => q ? q.slice(8,10)+'/'+q.slice(5,7)+'/'+q.slice(0,4)+' '+q.slice(11,16) : '';
const hojeIso = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

let token = store.get('escala_token');
const S = { offline:false, cacheQuando:0, usuario:null, escala:[], auxiliares:[], ano:null, mes:null, soMinhas:false, tab:'escala',
            adm:{ aux:[], usuarios:[] }, editando:null, prev:null, hist:null, sis:null };
const isAdmin = () => S.usuario && S.usuario.nivel === 'admin';
const podeEditar = () => isAdmin() && !S.offline;

/* ---------- chamada ao servidor ---------- */
const API_URL = String(window.ESCALA_API_URL || '').trim();
async function api(fn, ...args){
  if (!API_URL || API_URL.indexOf('COLE_AQUI') >= 0) throw new Error('Falta configurar a URL do servidor no arquivo config.js.');
  let resp;
  try {
    // text/plain evita o "preflight" do navegador, que o Apps Script não responde
    resp = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ fn, args }) });
  } catch(e){ const err = new Error('Sem conexão com o servidor.'); err.offline = true; throw err; }
  let r;
  try { r = await resp.json(); }
  catch(e){ throw new Error('Resposta inválida do servidor. Confira a URL e se a implantação permite acesso a "Qualquer pessoa".'); }
  if (r && r.ok) return r;
  if (r && r.erro === 'SESSAO_EXPIRADA'){ sair(); throw new Error('Sessão expirada. Entre novamente.'); }
  throw new Error((r && r.erro) || 'Erro inesperado.');
}
let toastT;
function toast(msg, erro){
  const t = $('#toast'); t.textContent = msg; t.className = 'on' + (erro ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', erro ? 3800 : 1600);
}
async function busy(btn, fn){
  const txt = btn && btn.textContent; if (btn){ btn.disabled = true; }
  try { return await fn(); } finally { if (btn){ btn.disabled = false; btn.textContent = txt; } }
}

/* ---------- login / sessão ---------- */
$('#f-login').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('#l-erro').textContent = ''; $('#l-info').textContent = '';
  const btn = $('#l-btn'); btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const r = await api('login', $('#l-user').value, $('#l-pass').value);
    token = r.token; store.set('escala_token', token); $('#l-pass').value = '';
    await iniciar();
  } catch(e){ $('#l-erro').textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = 'Entrar'; }
});
function sair(){
  const t = token; token = null;
  if (t) api('logout', t).catch(() => {});
  store.del('escala_token'); store.del('escala_cache'); S.usuario = null; S.prev = null; S.hist = null; S.sis = null;
  $('#app').hidden = true; $('#login').hidden = false;
}
let ultimaCarga = 0;
function lerCache(){ try { return JSON.parse(store.get('escala_cache')); } catch(e){ return null; } }
async function recarregar(){
  try {
    const r = await api('carregar', token);
    S.usuario = r.usuario; S.escala = r.escala; S.auxiliares = r.auxiliares; S.offline = false;
    store.set('escala_cache', JSON.stringify({ quando: Date.now(), usuario: r.usuario, escala: r.escala, auxiliares: r.auxiliares }));
  } catch(e){
    const c = e.offline ? lerCache() : null;
    if (!c) throw e;
    S.usuario = c.usuario; S.escala = c.escala; S.auxiliares = c.auxiliares; S.offline = true; S.cacheQuando = c.quando;
    return;
  }
  ultimaCarga = Date.now();
  if (isAdmin()){ const a = await api('adminDados', token); S.adm.aux = a.auxiliares; S.adm.usuarios = a.usuarios; }
}
function atualizarBanner(){
  const b = $('#off'); b.hidden = !S.offline;
  if (!S.offline) return;
  const d = new Date(S.cacheQuando);
  b.textContent = 'Sem internet. Mostrando a escala salva em ' + d.toLocaleDateString('pt-BR') + ' às ' +
    d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) + (isAdmin() ? '. Edição indisponível.' : '.');
}
window.addEventListener('online', () => { if (S.offline && token) recarregar().then(renderTudo).catch(() => {}); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !token || !S.usuario || S.tab !== 'escala') return;
  if (Date.now() - ultimaCarga < 60000 || $('#dlg').open) return;
  recarregar().then(renderTudo).catch(() => {});
});
$('#l-esqueci').onclick = async () => {
  const u = $('#l-user').value.trim(); $('#l-erro').textContent = ''; $('#l-info').textContent = '';
  if (!u){ $('#l-erro').textContent = 'Digite seu usuário acima e toque de novo em “Esqueci minha senha”.'; return; }
  try { const r = await api('pedirNovaSenha', u); $('#l-info').textContent = r.mensagem; }
  catch(e){ $('#l-erro').textContent = e.message; }
};
async function iniciar(){
  try { await recarregar(); }
  catch(e){ $('#login').hidden = false; $('#app').hidden = true; if (token) $('#l-erro').textContent = e.message; return; }
  $('#login').hidden = true; $('#app').hidden = false;
  $('#who').textContent = S.usuario.nome + (isAdmin() ? ' · admin' : '');
  S.tab = 'escala'; renderNav(); renderTudo();
}
$('#refresh').onclick = async () => { try { await recarregar(); renderTudo(); toast(S.offline ? 'Continua sem internet' : 'Atualizado', S.offline); } catch(e){ toast(e.message, true); } };

/* ---------- navegação ---------- */
function renderNav(){
  const abas = [['escala','📅','Escala']];
  if (isAdmin()) abas.push(['aux','👥','Auxiliares'],['users','🔑','Usuários'],['gerar','🔄','Ano novo']);
  abas.push(['conta','⚙️','Conta']);
  const pend = isAdmin() ? S.adm.usuarios.filter(u => u.pediuSenha).length : 0;
  $('#nav').innerHTML = abas.map(([k,i,t]) => `<button data-tab="${k}" class="${(S.tab===k || (k==='conta' && S.tab==='sistema'))?'on':''}"><i>${i}</i>${t}${k==='users' && pend ? `<em class="bolha">${pend}</em>` : ''}</button>`).join('');
}
$('#nav').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  S.tab = b.dataset.tab; renderNav(); renderTudo(); window.scrollTo(0,0);
});
function renderTudo(){
  atualizarBanner(); renderNav();
  ['escala','aux','users','gerar','conta','sistema'].forEach(k => $('#v-'+k).hidden = S.tab !== k);
  if (S.offline && ['aux','users','gerar','sistema'].includes(S.tab)){ $('#v-'+S.tab).innerHTML = '<p class="vazio">Disponível apenas com internet.</p>'; return; }
  ({escala:renderEscala, aux:renderAux, users:renderUsers, gerar:renderGerar, conta:renderConta, sistema:renderSistema})[S.tab]();
}

/* ---------- ESCALA ---------- */
function opts(atual, lista){
  const l = (!atual || lista.includes(atual)) ? lista : [atual, ...lista];
  return '<option value="">—</option>' + l.map(n => `<option ${n===atual?'selected':''}>${esc(n)}</option>`).join('');
}
function cardDia(r, meu, prox, comMes){
  const [y,m,d] = r.data.split('-').map(Number);
  const cel = (campo, rot) => {
    const v = r[campo];
    if (podeEditar()) return `<div class="t"><label>${rot}</label><select class="cel" data-data="${r.data}" data-campo="${campo}">${opts(v, S.auxiliares)}</select></div>`;
    return `<div class="t"><label>${rot}</label><span class="v ${meu && v===meu ? 'eu':''}">${esc(v) || '—'}</span></div>`;
  };
  const orac = podeEditar()
    ? `<select class="cel" data-data="${r.data}" data-campo="oracao">${['Irmãos','Irmãs'].map(o=>`<option ${o===r.oracao?'selected':''}>${o}</option>`).join('')}</select>`
    : `<span class="v">${esc(r.oracao)}</span>`;
  return `<article class="dia ${prox?'prox':''}">
    <div class="data"><b>${String(d).padStart(2,'0')}</b><span>${MES3[m-1]}</span>${prox?'<em>PRÓXIMO</em>':''}${r.obs?`<br><em class="obs">${esc(r.obs)}</em>`:''}</div>
    <div class="turmas">${cel('t1','1ª Turma')}${cel('t2','2ª Turma')}${cel('t3','3ª Turma')}</div>
    <div class="o" style="grid-column:2"><label>Oração</label>${orac}${podeEditar()?`<button class="mais" data-mais="${r.data}" aria-label="Opções da data">⋯</button>`:''}</div>
  </article>`;
}
function renderEscala(){
  const el = $('#v-escala'), hoje = hojeIso();
  const anos = [...new Set(S.escala.map(r => +r.data.slice(0,4)))].sort((a,b)=>a-b);
  if (!anos.length){
    el.innerHTML = '<p class="vazio">Nenhuma escala cadastrada ainda.' + (isAdmin() ? '<br>Use a aba “Ano novo” para gerar.' : '') + '</p>'; return;
  }
  if (!anos.includes(S.ano)) S.ano = anos.includes(+hoje.slice(0,4)) ? +hoje.slice(0,4) : anos[anos.length-1];
  const doAno = S.escala.filter(r => +r.data.slice(0,4) === S.ano);
  const meses = [...new Set(doAno.map(r => +r.data.slice(5,7)))];
  if (!meses.includes(S.mes)) S.mes = (+hoje.slice(0,4) === S.ano && meses.includes(+hoje.slice(5,7))) ? +hoje.slice(5,7) : meses[0];
  const meu = S.usuario.auxiliar;
  const prox = (S.escala.find(r => r.data >= hoje) || {}).data;

  let html = `<div class="bar"><select id="sel-ano">${anos.map(a=>`<option ${a===S.ano?'selected':''}>${a}</option>`).join('')}</select>`;
  if (!S.soMinhas) html += `<div class="chips">${meses.map(m=>`<button class="chip ${m===S.mes?'on':''}" data-mes="${m}">${MESES[m-1].slice(0,3)}</button>`).join('')}</div>`;
  html += '</div>';
  if (meu) html += `<label class="toggle"><input type="checkbox" id="so-minhas" ${S.soMinhas?'checked':''}> Mostrar só os dias em que ${esc(meu)} está escalado</label>`;
  html += '<div class="acoes">' + (!S.soMinhas ? '<button class="btn sec peq" id="a-zap">💬 Compartilhar no WhatsApp</button>' : '') +
    (meu ? '<button class="btn sec peq" id="a-ics">📆 Adicionar meus dias ao calendário</button>' : '') + '</div>';

  if (S.soMinhas){
    const mine = doAno.filter(r => [r.t1,r.t2,r.t3].includes(meu));
    html += mine.length ? mine.map(r => cardDia(r, meu, r.data===prox)).join('') : '<p class="vazio">Nenhum dia encontrado neste ano.</p>';
  } else {
    html += `<div class="mes-linha"><h3 class="mes-tit">${MESES[S.mes-1]} ${S.ano}</h3>${podeEditar()?'<button class="btn sec peq" id="a-add">+ Data</button>':''}</div>` +
      doAno.filter(r => +r.data.slice(5,7) === S.mes).map(r => cardDia(r, meu, r.data===prox)).join('');
  }
  el.innerHTML = html;
}
$('#v-escala').addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if (c){ S.mes = +c.dataset.mes; renderEscala(); return; }
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'a-zap') return compartilharZap();
  if (b.id === 'a-ics') return baixarIcs();
  if (b.id === 'a-add') return abrirData(null);
  if (b.dataset.mais) return abrirData(S.escala.find(r => r.data === b.dataset.mais));
});

/* ---------- WhatsApp e calendário ---------- */
function textoMes(){
  const rows = S.escala.filter(r => +r.data.slice(0,4) === S.ano && +r.data.slice(5,7) === S.mes);
  const blocos = rows.map(r => { const [, m, d] = r.data.split('-');
    return `*${d}/${m}*${r.obs ? ' (' + r.obs + ')' : ''}\n1ª Turma: ${r.t1 || '—'}\n2ª Turma: ${r.t2 || '—'}\n3ª Turma: ${r.t3 || '—'}\nOração: ${r.oracao}`; });
  return `*ESCALA DE AUXILIARES - ${MESES[S.mes-1].toUpperCase()}/${S.ano}*\nParque Orlanda\n\n` + blocos.join('\n\n');
}
function compartilharZap(){ window.open('https://wa.me/?text=' + encodeURIComponent(textoMes()), '_blank'); }
const icsEsc = t => String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const icsDobra = l => { const o = []; while (l.length > 70){ o.push(l.slice(0,70)); l = ' ' + l.slice(70); } o.push(l); return o.join('\r\n'); };
function icsTexto(){
  const meu = S.usuario.auxiliar, hoje = hojeIso();
  const rows = S.escala.filter(r => r.data >= hoje && [r.t1, r.t2, r.t3].includes(meu));
  if (!rows.length) return '';
  const agora = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Escala de Auxiliares//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Minha escala de auxiliar'];
  rows.forEach(r => {
    const fim = new Date(r.data + 'T12:00:00Z'); fim.setUTCDate(fim.getUTCDate() + 1);
    const turma = r.t1 === meu ? '1ª Turma' : r.t2 === meu ? '2ª Turma' : '3ª Turma';
    const com = [r.t1, r.t2, r.t3].filter(n => n && n !== meu);
    L.push('BEGIN:VEVENT', 'UID:escala-' + r.data + '-' + S.usuario.usuario + '@escala-auxiliares', 'DTSTAMP:' + agora,
      'DTSTART;VALUE=DATE:' + r.data.replace(/-/g,''), 'DTEND;VALUE=DATE:' + fim.toISOString().slice(0,10).replace(/-/g,''),
      'SUMMARY:' + icsEsc('Auxiliar - ' + turma + (r.obs ? ' (' + r.obs + ')' : '')),
      'DESCRIPTION:' + icsEsc('Escala de auxiliares - Parque Orlanda\n' + turma + (com.length ? '\nCom: ' + com.join(', ') : '') + '\nOração: ' + r.oracao),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Amanhã você está na escala de auxiliares','TRIGGER:-PT15H','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsDobra).join('\r\n') + '\r\n';
}
async function baixarIcs(){
  const txt = icsTexto(); if (!txt) return toast('Nenhum dia futuro encontrado.', true);
  const arq = new File([txt], 'minha-escala.ics', { type:'text/calendar' });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files:[arq] })){
    try { await navigator.share({ files:[arq], title:'Minha escala' }); return; } catch(e){ if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(arq), a = document.createElement('a');
  a.href = url; a.download = 'minha-escala.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Arquivo baixado. Abra-o para adicionar ao calendário.');
}

let dataEdit = null;
function abrirData(r){
  dataEdit = r ? r.data : null;
  $('#d-t').textContent = r ? 'Data ' + dataBR(r.data) : 'Nova data';
  $('#d-data').value = r ? r.data : ''; $('#d-data').disabled = !!r;
  $('#d-obs').value = r ? r.obs : ''; $('#d-prep').checked = false;
  $('#d-prep-l').hidden = !!r; $('#d-rem').hidden = !r; $('#d-erro').textContent = '';
  $('#dlg-data').showModal();
}
$('#d-cancel').onclick = () => $('#dlg-data').close();
$('#d-save').onclick = async ev => {
  await busy(ev.target, async () => {
    try {
      const data = dataEdit || $('#d-data').value;
      await api('salvarData', token, { data, obs: $('#d-obs').value, novo: !dataEdit, preencher: $('#d-prep').checked });
      await recarregar(); S.ano = +data.slice(0,4); S.mes = +data.slice(5,7);
      $('#dlg-data').close(); renderTudo(); toast('Salvo ✓');
    } catch(e){ $('#d-erro').textContent = e.message; }
  });
};
$('#d-rem').onclick = async ev => {
  if (!confirm('Remover ' + dataBR(dataEdit) + ' da escala? (Dá para desfazer pelo Histórico.)')) return;
  await busy(ev.target, async () => {
    try { await api('removerData', token, dataEdit); await recarregar(); $('#dlg-data').close(); renderTudo(); toast('Data removida'); }
    catch(e){ $('#d-erro').textContent = e.message; }
  });
};
$('#v-escala').addEventListener('change', async ev => {
  const s = ev.target;
  if (s.id === 'sel-ano'){ S.ano = +s.value; renderEscala(); return; }
  if (s.id === 'so-minhas'){ S.soMinhas = s.checked; renderEscala(); return; }
  if (!s.classList.contains('cel')) return;
  const { data, campo } = s.dataset, linha = S.escala.find(r => r.data === data), antigo = linha[campo], novo = s.value;
  if (campo !== 'oracao' && novo && ['t1','t2','t3'].some(c => c !== campo && linha[c] === novo)
      && !confirm(novo + ' já está escalado neste mesmo dia. Salvar mesmo assim?')){ s.value = antigo; return; }
  s.disabled = true;
  try { await api('salvarDesignacao', token, data, campo, novo); linha[campo] = novo; toast('Salvo ✓'); renderEscala(); }
  catch(e){ s.value = antigo; s.disabled = false; toast(e.message, true); }
});

  const L = S.adm.aux;
  $('#v-aux').innerHTML = `<div class="painel"><h2>Fila do rodízio</h2>
    <p>A ordem desta lista é a fila usada para gerar a escala. Use as setas para mudar a ordem. Desative quem sair (o histórico é mantido).</p>
    <ul class="lista">${L.map((a,i)=>`<li class="${a.ativo?'':'off'}" data-i="${i}">
      <button class="ic" data-act="up" ${i===0?'disabled':''} aria-label="Subir">↑</button>
      <button class="ic" data-act="down" ${i===L.length-1?'disabled':''} aria-label="Descer">↓</button>
      <input type="text" value="${esc(a.nome)}" data-act="nome">
      <label class="sw"><input type="checkbox" data-act="ativo" ${a.ativo?'checked':''}>ativo</label></li>`).join('')}</ul>
    <div class="row"><input id="aux-novo" class="novo" placeholder="Novo auxiliar">
      <button class="btn sec" id="aux-add" style="flex:none">Adicionar</button></div></div>
    <button class="btn" id="aux-save" style="width:100%">Salvar fila</button>`;
}
$('#v-aux').addEventListener('click', async ev => {
  const L = S.adm.aux, b = ev.target.closest('button'); if (!b) return;
  const li = b.closest('li'), i = li ? +li.dataset.i : -1;
  if (b.dataset.act === 'up' && i > 0){ [L[i-1], L[i]] = [L[i], L[i-1]]; renderAux(); }
  else if (b.dataset.act === 'down' && i < L.length-1){ [L[i+1], L[i]] = [L[i], L[i+1]]; renderAux(); }
  else if (b.id === 'aux-add'){
    const n = $('#aux-novo').value.trim(); if (!n) return;
    L.push({ orig:'', nome:n, ativo:true }); renderAux();
  } else if (b.id === 'aux-save'){
    await busy(b, async () => {
      try { await api('salvarAuxiliares', token, L); await recarregar(); renderAux(); toast('Fila salva ✓'); }
      catch(e){ toast(e.message, true); }
    });
  }
});
$('#v-aux').addEventListener('input', ev => {
  const t = ev.target, li = t.closest('li'); if (!li) return;
  const a = S.adm.aux[+li.dataset.i];
  if (t.dataset.act === 'nome') a.nome = t.value;
  if (t.dataset.act === 'ativo'){ a.ativo = t.checked; li.classList.toggle('off', !t.checked); }
});

/* ---------- ANO NOVO (admin) ---------- */
function linhaPrev(l){
  const [, m, d] = l.data.split('-');
  const txt = l.incluida ? `${esc(l.t1)} · ${esc(l.t2)} · ${esc(l.t3)} <small>${esc(l.oracao)}</small>` : '<i>sem reunião</i>';
  return `<label class="prev-linha ${l.incluida ? '' : 'off'}"><input type="checkbox" data-pdata="${l.data}" ${l.incluida ? 'checked' : ''}><b>${d}/${m}</b>
    <span>${txt}${l.extra ? ' <em class="obs">extra</em>' : ''}${l.obs ? ' <em class="obs">' + esc(l.obs) + '</em>' : ''}</span></label>`;
}
function renderGerar(){
  const el = $('#v-gerar'), P = S.prev;
  if (!P || !P.dados){
    const ult = S.escala.length ? +S.escala[S.escala.length-1].data.slice(0,4) : new Date().getFullYear() - 1;
    el.innerHTML = `<div class="painel"><h2>Gerar rodízio automático</h2>
      <p>Escolha o ano e veja uma prévia antes de gravar. Na prévia você pode tirar domingos sem reunião (eles não gastam a vez de ninguém) e incluir datas extras.</p>
      <label class="field"><span>Ano</span><input id="g-ano" type="number" inputmode="numeric" value="${P ? P.ano : ult + 1}" min="2000" max="2100"></label>
      <button class="btn" id="g-prev" style="width:100%">Ver prévia</button></div>`;
    return;
  }
  const d = P.dados;
  const cont = Object.entries(d.contagem).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([n, c]) => `<span>${esc(n)} ${c}</span>`).join('');
  el.innerHTML = `<div class="painel"><h2>Prévia de ${P.ano}</h2>
    <p>${d.aPartirDe ? `Continua depois de ${dataBR(d.aPartirDe.data)} (último: ${esc(d.aPartirDe.t3)}).` : 'Começa do início da fila.'} Desmarque os dias sem reunião.</p>
    ${d.existentes ? `<div class="aviso">Já existe escala de ${P.ano} (${d.existentes} datas). Ao gerar, ela será substituída. Dá para desfazer pelo Histórico.</div>` : ''}
    <div id="prev-lista">${d.linhas.map(linhaPrev).join('')}</div>
    <h3 class="mes-tit">Data extra (assembleia, visita…)</h3>
    <div class="row"><input id="x-data" type="date" class="novo" min="${P.ano}-01-01" max="${P.ano}-12-31"><input id="x-obs" class="novo" placeholder="Motivo (opcional)" maxlength="60"></div>
    <button class="btn sec" id="x-add" style="width:100%;margin-top:8px">+ Incluir data extra</button>
    <h3 class="mes-tit">Quantas vezes cada um serve</h3><div class="cont">${cont}</div></div>
    <div class="row"><button class="btn sec" id="g-cancel">Voltar</button><button class="btn" id="g-ok">Gerar escala</button></div>`;
}
async function carregarPrev(){
  const P = S.prev; $('#v-gerar').classList.add('load');
  try { P.dados = await api('previaAno', token, P.ano, P.excluir, P.extras); }
  catch(e){ toast(e.message, true); if (!P.dados) S.prev = null; }
  $('#v-gerar').classList.remove('load'); renderGerar();
}
$('#v-gerar').addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'g-prev'){ S.prev = { ano: +$('#g-ano').value, excluir: [], extras: [], dados: null }; await busy(b, carregarPrev); }
  else if (b.id === 'g-cancel'){ S.prev = null; renderGerar(); }
  else if (b.id === 'x-add'){
    const dt = $('#x-data').value; if (!dt) return toast('Escolha a data extra.', true);
    if (dt.slice(0,4) !== String(S.prev.ano)) return toast('A data precisa ser de ' + S.prev.ano + '.', true);
    S.prev.extras = S.prev.extras.filter(x => x.data !== dt).concat([{ data: dt, obs: $('#x-obs').value }]);
    S.prev.excluir = S.prev.excluir.filter(x => x !== dt);
    await carregarPrev();
  } else if (b.id === 'g-ok'){
    const P = S.prev, ex = P.dados.existentes;
    if (ex && !confirm(`Já existem ${ex} datas em ${P.ano}. Substituir tudo (inclusive ajustes manuais)?`)) return;
    await busy(b, async () => {
      try {
        const r = await api('gerarAno', token, P.ano, ex > 0, P.excluir, P.extras);
        await recarregar(); S.prev = null; S.ano = P.ano; S.mes = null; S.tab = 'escala'; renderTudo();
        toast(`Escala ${P.ano} gerada (${r.geradas} datas) ✓`);
      } catch(e){ toast(e.message, true); }
    });
  }
});
$('#v-gerar').addEventListener('change', async ev => {
  const c = ev.target; if (!c.dataset.pdata) return;
  const P = S.prev, dt = c.dataset.pdata;
  P.excluir = c.checked ? P.excluir.filter(x => x !== dt) : P.excluir.concat([dt]);
  await carregarPrev();
});

    ${isAdmin() ? '<button class="btn sec" id="c-sis" style="width:100%;margin:0 0 12px">🗂 Histórico e backup</button>' : ''}${blocoInstalar()}
    <button class="btn danger" id="c-sair" style="width:100%">Sair</button>
    <p class="dica" style="text-align:center;margin:14px 0 0">Versão ${esc(self.ESCALA_VERSAO || '')}</p>`;
}
$('#v-conta').addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'c-sair') return sair();
  if (b.id === 'c-sis') return abrirSistema();
  if (b.id === 'c-inst' && instalar){ instalar.prompt(); instalar = null; return renderConta(); }
  if (b.id === 'c-save') await busy(b, async () => {
    try { await api('alterarSenha', token, $('#c-atual').value, $('#c-nova').value);
          $('#c-atual').value = $('#c-nova').value = ''; toast('Senha alterada ✓'); }
    catch(e){ toast(e.message, true); }
  });
});

/* ---------- HISTÓRICO E BACKUP (admin) ---------- */
async function abrirSistema(){
  S.tab = 'sistema'; S.hist = null; S.sis = null; renderTudo(); window.scrollTo(0,0);
  try { const [h, s2] = await Promise.all([api('historico', token), api('sistema', token)]); S.hist = h.itens; S.sis = s2; }
  catch(e){ toast(e.message, true); S.hist = S.hist || []; }
  renderSistema();
}
function renderSistema(){
  const s2 = S.sis, h = S.hist;
  const bk = !s2 ? '<p>Carregando…</p>' : `<p>Último backup: <b>${s2.ultimoBackup ? fmtQuando(s2.ultimoBackup) : 'nenhum ainda'}</b><br>
      Backup automático semanal: <b>${s2.gatilhoAtivo === true ? 'ativo' : s2.gatilhoAtivo === false ? 'desativado' : 'não verificado'}</b> · guarda as últimas ${s2.manter} cópias no seu Google Drive.</p>
      ${s2.gatilhoAtivo === false ? '<p class="dica">Para ativar o automático, rode a função ativarBackupSemanal uma vez no editor do Apps Script.</p>' : ''}
      <button class="btn" id="s-backup" style="width:100%">Fazer backup agora</button>`;
  const lista = !h ? '<p>Carregando…</p>' : h.length ? '<ul class="hist">' + h.map(i => `<li class="${i.desfeito ? 'desfeito' : ''}"><div>
      <small>${fmtQuando(i.quando)} · ${esc(i.usuario)}</small><b>${esc(i.acao)}</b>: ${esc(i.detalhe)}${i.desfeito ? ' <em class="obs">desfeito</em>' : ''}</div>
      ${i.desfazivel ? `<button class="btn sec peq" data-des="${esc(i.id)}">Desfazer</button>` : ''}</li>`).join('') + '</ul>' : '<p class="vazio">Nada registrado ainda.</p>';
  $('#v-sistema').innerHTML = `<button class="link" id="s-voltar" style="text-align:left;padding-left:2px">← Voltar para Conta</button>
    <div class="painel"><h2>Cópia de segurança</h2>${bk}</div>
    <div class="painel"><h2>Histórico de alterações</h2><p>Últimas 100 alterações. “Desfazer” volta uma mudança específica.</p>${lista}</div>`;
}
$('#v-sistema').addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 's-voltar'){ S.tab = 'conta'; renderTudo(); return; }
  if (b.id === 's-backup') return busy(b, async () => {
    try { S.sis = await api('backupAgora', token); const h = await api('historico', token); S.hist = h.itens; renderSistema(); toast('Backup criado ✓'); }
    catch(e){ toast(e.message, true); }
  });
  if (b.dataset.des){
    if (!confirm('Desfazer esta alteração?')) return;
    await busy(b, async () => {
      try { await api('desfazer', token, b.dataset.des); await recarregar(); const h = await api('historico', token); S.hist = h.itens; renderSistema(); toast('Alteração desfeita ✓'); }
      catch(e){ toast(e.message, true); }
    });
  }
});

/* ---------- início ---------- */
let swReg = null, querAtualizar = false;
function mostrarAtualizacao(w){
  $('#upd').hidden = false;
  $('#upd-btn').onclick = () => { querAtualizar = true; $('#upd-btn').disabled = true; w.postMessage('SKIP_WAITING'); };
}
if ('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (querAtualizar) location.reload(); });
  window.addEventListener('load', async () => {
    try {
      swReg = await navigator.serviceWorker.register('sw.js');
      if (swReg.waiting && navigator.serviceWorker.controller) mostrarAtualizacao(swReg.waiting);
      swReg.addEventListener('updatefound', () => {
        const novo = swReg.installing; if (!novo) return;
        novo.addEventListener('statechange', () => { if (novo.state === 'installed' && navigator.serviceWorker.controller) mostrarAtualizacao(novo); });
      });
    } catch(e){}
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && swReg) swReg.update().catch(() => {}); });
}
if (token) iniciar(); else $('#login').hidden = false;
</script>
